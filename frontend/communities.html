<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communities · afterclass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="communities">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="container">
    <div class="page-head">
        <h1 class="section__title">Communities</h1>
    </div>

    <p class="lead">
        Every club and student team at MIT Manipal, open to everyone.
    </p>

    <div id="community-tabs" class="tabs" hidden>
        <button
            class="tab active"
            type="button"
            data-tab="yours">
            Your communities
        </button>

        <button
            class="tab"
            type="button"
            data-tab="all">
            All communities
        </button>
    </div>

    <section id="your-communities" hidden>
        <div id="your-clubs" class="grid"></div>
    </section>

    <section id="all-communities">
        <div id="clubs" class="grid"></div>
    </section>
</main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/communities.js"></script>
</body>
</html>
